<div class="password-control">
    {{ field }}
    <button type="button" class="password-toggle" hidden
            aria-label="Show {{ field.label|lower }}" aria-controls="{{ field.auto_id }}"
            aria-pressed="false" data-password-label="{{ field.label|lower }}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
            <path class="eye-slash" d="M3 3 21 21"/>
        </svg>
    </button>
</div>
